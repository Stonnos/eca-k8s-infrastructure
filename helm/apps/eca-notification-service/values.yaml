appName: eca-notification-service

image:
  repository: eca-notification-service

resources:
  limits:
    memory: 512Mi

env:
  OPENAPI_BASEPATH: "/eca-notification-service"
  AUDIT_ENABLED: "true"
  AUDIT_ASYNCEVENTS: "true"
  AUDIT_THREADPOOLSIZE: "3"
  REDELIVERY_ENABLED: "true"
  LOCK_ENABLED: "true"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-db:5433/eca_notification_service"
  SPRING_JPA_HIBERNATE_DDLAUTO: "validate"
  SPRING_MAIL_USERNAME: "rbatsw@gmail.com"
  MAIL_SENDER: "rbatsw@gmail.com"
  EUREKA_INSTANCE_PREFERIPADDRESS: "true"
  EUREKA_CLIENT_REGISTERWITHEUREKA: "true"
  EUREKA_CLIENT_FETCHREGISTRY: "true"
  JAVA_OPTS: "-Xmx384m -XX:MaxMetaspaceSize=256m"

secrets:
  SPRING_DATASOURCE_USERNAME: POSTGRES_USER
  SPRING_DATASOURCE_PASSWORD: POSTGRES_PASSWORD
  SPRING_MAIL_PASSWORD: EMAIL_PASSWORD