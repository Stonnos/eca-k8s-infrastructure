apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.appName }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Values.appName }}
  ports:
    - name: tempo-query
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.container.port }}
    - name: zipkin
      port: {{ .Values.service.zipkinPort }}
      targetPort: {{ .Values.container.zipkinPort }}